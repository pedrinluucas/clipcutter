# Gera os instaladores na nuvem.
#
# POR QUE ISTO EXISTE
# -------------------
# A máquina de desenvolvimento tem Smart App Control ligado, e o electron-builder
# precisa EXECUTAR um desinstalador recém-compilado para montar o instalador
# NSIS. O SAC bloqueia essa execução (`spawn UNKNOWN`), então o instalador não
# pode mais ser gerado lá. Aqui pode.
#
# E o .dmg do macOS só pode ser criado no próprio macOS — nenhuma máquina Windows
# gera um, por mais configuração que se faça.
#
# Os dois builds ficam em "Artifacts", na página do run. Ao publicar uma tag
# (v1.0.1, por exemplo), viram uma Release com os arquivos anexados.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # NÃO use `--ignore-scripts` aqui. Ele pula o download dos binários do
      # FFmpeg, e três testes (`*.integration.test.ts`) executam ffmpeg e ffprobe
      # de verdade — cortam um vídeo, matam o processo no meio, conferem o
      # resultado com ffprobe. Sem os binários eles falham, e foi o que derrubou
      # o primeiro run deste workflow.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--publish never` NÃO é opcional aqui. O electron-builder detecta que está
      # num CI e tenta publicar o resultado numa release por conta própria; sem
      # `GH_TOKEN` ele aborta com "GitHub Personal Access Token is not set" DEPOIS
      # de ter construído tudo. O job morria com o instalador pronto no disco.
      # Quem publica é o job `release`, e só quando existe uma tag.
      #
      # O erro vai para uma ANOTAÇÃO do run, não só para o log.
      # Motivo: o log de um run exige autenticação para ser lido pela API, mas as
      # anotações são públicas. Sem isto, uma falha aqui aparece de fora apenas
      # como "exit code 1", e diagnosticar vira adivinhação.
      - name: build:win
        shell: bash
        run: |
          set -o pipefail
          npm run build:win -- --publish never 2>&1 | tee build.log || {
            echo "::error title=build:win falhou::$(tail -c 1500 build.log | tr '\n' ' ' | tr -s ' ')"
            exit 1
          }
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows-instalador
          path: dist/*setup.exe
          retention-days: 30

  macos:
    needs: testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NÃO volte a pôr `CSC_IDENTITY_AUTO_DISCOVERY: false` aqui. Ele fazia o
      # electron-builder pular a assinatura por completo, e em Apple Silicon o
      # macOS recusa executar binário sem assinatura -- em silêncio. A assinatura
      # ad-hoc está declarada em electron-builder.yml (`mac.identity: '-'`), que é
      # o suficiente para o app abrir sem certificado da Apple.
      - name: build:mac
        shell: bash
        run: |
          set -o pipefail
          npm run build:mac -- --publish never 2>&1 | tee build.log || {
            echo "::error title=build:mac falhou::$(tail -c 1500 build.log | tr '\n' ' ' | tr -s ' ')"
            exit 1
          }
      # O app EMPACOTAR não significa que ele ABRE. O .dmg da v1.0.0 saiu perfeito
      # daqui e, no Mac do Pedro, subia e morria sozinho sem escrever uma linha.
      # O runner do macOS é um Mac de verdade: se o app não fica de pé aqui, o
      # build falha e ninguém baixa um instalador quebrado.
      # CONTROLE DO EXPERIMENTO. Antes de julgar o ClipCutter, provar que um app
      # Electron QUALQUER abre neste runner. Se nem o minimo abrir, o teste
      # abaixo esta medindo o ambiente -- e as rodadas #10 a #18 interrogaram a
      # testemunha errada.
      - name: um Electron minimo abre aqui?
        run: |
          set +e
          mkdir -p /tmp/mini
          printf '{"name":"mini","version":"1.0.0","main":"m.js"}' > /tmp/mini/package.json
          printf 'const {app}=require("electron");app.whenReady().then(()=>{require("fs").writeFileSync("/tmp/mini-abriu","ok")})' > /tmp/mini/m.js
          rm -f /tmp/mini-abriu
          node_modules/electron/dist/Electron.app/Contents/MacOS/Electron /tmp/mini > /tmp/mini.log 2>&1 &
          MPID=$!
          sleep 15
          kill $MPID 2>/dev/null
          if [ -f /tmp/mini-abriu ]; then
            echo "CONTROLE OK: Electron minimo abre neste runner"
          else
            SAIDA_MINI=$(cat /tmp/mini.log | tr '[:space:]' ' ' | tr -s ' ' | tail -c 900)
            echo "::error title=nem o Electron minimo abre neste runner::[${SAIDA_MINI:-sem saida}] -- o teste do ClipCutter esta medindo o AMBIENTE, nao o app"
          fi

      # BISSECAO. O controle acima provou que Electron abre neste runner, e o
      # ClipCutter empacotado nao. Restam dois suspeitos: o meu codigo, ou o
      # empacotamento. Rodar o NOSSO app.asar pelo Electron ORIGINAL separa os
      # dois -- e, se for o codigo, o Electron original IMPRIME o erro, coisa que
      # o app empacotado nunca fez em nove rodadas.
      - name: nosso codigo roda no Electron original?
        run: |
          set +e
          APP=$(find dist -maxdepth 3 -name 'ClipCutter.app' -print -quit)
          rm -f /tmp/clipcutter-boot.log
          node_modules/electron/dist/Electron.app/Contents/MacOS/Electron             "$APP/Contents/Resources/app.asar" > /tmp/asar-solto.log 2>&1 &
          APID=$!
          sleep 18
          if kill -0 $APID 2>/dev/null; then
            kill $APID 2>/dev/null
            echo "ABRIU -- o codigo esta so; o defeito e do EMPACOTAMENTO"
            echo "::error title=bissecao: o codigo roda, o pacote nao::nosso app.asar abre pelo Electron original. O defeito esta no empacotamento (Info.plist, fuses ou assinatura), nao no codigo."
          else
            SAIDA_ASAR=$(cat /tmp/asar-solto.log | tr '[:space:]' ' ' | tr -s ' ' | tail -c 1000)
            DIA=$(cat /tmp/clipcutter-boot.log 2>/dev/null | tr '[:space:]' ' ' | tr -s ' ' | tail -c 500)
            echo "::error title=bissecao: o codigo tambem morre no Electron original::SAIDA=[${SAIDA_ASAR:-vazia}] DIARIO=[${DIA:-vazio}]"
          fi

      - name: o app abre?
        run: |
          APP=$(find dist -maxdepth 3 -name 'ClipCutter.app' -print -quit)
          BIN="$APP/Contents/MacOS/ClipCutter"
          echo "testando: $BIN"
          DIARIO="${TMPDIR:-/tmp}/clipcutter-boot.log"
          rm -f "$DIARIO" saida-do-app.log
          # A saída do processo vai para arquivo, não só para o log do job: o log
          # exige autenticação para ser lido de fora, e é justamente a mensagem de
          # erro que faz falta. `--enable-logging` solta também o log do Chromium.
          # `set +e` NAO e opcional: o GitHub roda cada passo com `bash -e`, e o
          # `wait` abaixo devolve o codigo de falha do app -- o que abortava o
          # script ANTES da linha que publica a mensagem de erro. O run #11
          # falhou sem dizer nada por causa disso.
          set +e
          "$BIN" --enable-logging > saida-do-app.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "de pe apos 20s -- ok"
            kill $PID 2>/dev/null || true
            echo '--- diario da inicializacao ---'
            cat "$DIARIO" 2>/dev/null || echo '(sem diario)'
          else
            wait $PID
            CODIGO=$?
            # TUDO vai para a anotacao, que e publica. O log do job exige
            # autenticacao: nos runs #11 a #13 eu coletei diagnostico e o deixei
            # num lugar que nao consigo ler, perdendo duas rodadas.
            # Duas sondas que separam "o binario do Electron nao roda" de "o
            # meu codigo quebra". A primeira usa o proprio executavel como Node
            # puro; a segunda pede so a versao. Se AS DUAS falharem, o problema
            # esta no pacote e nao em nada que eu escrevi.
            SONDA_NODE=$(ELECTRON_RUN_AS_NODE=1 "$BIN" -e "process.stdout.write('node-ok')" 2>&1 | tail -c 200)
            SONDA_VER=$("$BIN" --version 2>&1 | tail -c 200)
            SAIDA=$(cat saida-do-app.log | tr '[:space:]' ' ' | tr -s ' ' | tail -c 700)
            DIARIO_TXT=$(cat "$DIARIO" 2>/dev/null | tr '[:space:]' ' ' | tr -s ' ' | tail -c 500)
            ASSIN=$(codesign -dv --verbose=2 "$APP" 2>&1 | tr '[:space:]' ' ' | tr -s ' ' | tail -c 400)
            # Sem grep por palavra-chave: as tentativas anteriores filtravam por
            # "signature|denied|invalid" e so devolviam ruido do LaunchServices.
            # O que o PROPRIO processo registrou e o que interessa.
            # `head`, nao `tail`: o run #17 capturou as ultimas linhas e so viu o
            # encerramento (CoreAnalytics cancelando XPC). O motivo esta no COMECO.
            log show --last 3m --predicate 'process == "ClipCutter"' --info --debug > log-processo.txt 2>/dev/null || true
            SISLOG=$(head -14 log-processo.txt | tr '[:space:]' ' ' | tr -s ' ' | tail -c 700)
            PISTA=$(grep -iE "asar|integrity|fatal|fuse|cannot|unable|fail" log-processo.txt | head -5 | tr '[:space:]' ' ' | tr -s ' ' | tail -c 600)
            # O diario tambem e escrito em /tmp: um app empacotado no macOS tem
            # TMPDIR proprio, num conteiner privado.
            DIARIO_TMP=$(cat /tmp/clipcutter-boot.log 2>/dev/null | tr '[:space:]' ' ' | tr -s ' ' | tail -c 400)
            # A integridade do asar vive no Info.plist. Se o Electron recusar o
            # pacote por causa dela, sai calado -- e o sintoma seria este.
            INTEG=$(plutil -p "$APP/Contents/Info.plist" 2>/dev/null | grep -iA4 integrity | tr '[:space:]' ' ' | tr -s ' ' | tail -c 300)
            echo "::error title=o app fecha sozinho no macOS (codigo $CODIGO)::SAIDA=[${SAIDA:-vazia}] DIARIO=[${DIARIO_TXT:-vazio}] ASSINATURA=[${ASSIN:-nao lida}] SONDA_NODE=[${SONDA_NODE:-vazia}] SONDA_VERSAO=[${SONDA_VER:-vazia}] DIARIO_TMP=[${DIARIO_TMP:-vazio}] INTEGRIDADE=[${INTEG:-ausente}] SISTEMA_INICIO=[${SISLOG:-nada}] PISTAS=[${PISTA:-nenhuma}]"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-saida-do-app
          path: saida-do-app.log
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefatos
      # Só os instaladores. `artefatos/**/*` levaria junto os build.log de
      # diagnóstico — os dois se chamam build.log, colidiriam pelo nome, e a
      # release é pública e permanente: não é lugar de log de build.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefatos/windows-instalador/*
            artefatos/macos-dmg/*
          generate_release_notes: true
          body: |
            Corta vídeo em partes — por duração fixa ou pelo segundo que você escolher.

            ## Windows
            Baixe o `.exe` e execute. Se o Windows avisar que bloqueou o app,
            é por **falta de reputação**, não por vírus: o arquivo acabou de ser
            compilado e nenhuma máquina no mundo o conhece ainda. Em *Mais informações*
            → *Executar assim mesmo*.

            ## macOS
            Baixe o `.dmg` e arraste para Aplicativos. Na primeira vez, abra com
            **botão direito → Abrir** — o app não é assinado pela Apple, e o duplo
            clique comum seria recusado.

            > O build do macOS nunca foi testado numa máquina real. Se algo não
            > funcionar, abra uma issue.
