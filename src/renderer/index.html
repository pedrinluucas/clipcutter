<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ClipCutter</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

         NÃO mover esta tag para o topo do <head>. Em dev, o electron-vite/Vite
         injeta o preâmbulo inline do React Fast Refresh acima dela — e um <meta>
         de CSP só passa a valer a partir de onde o parser HTML o encontra, nunca
         retroativamente para o que já rodou antes. Hoje a tag fica depois do
         <title>, então o preâmbulo (inserido antes de tudo em <head>) roda sem
         estar sujeito ao `script-src 'self'`. Se esta tag virar a primeira coisa
         em <head>, o preâmbulo passa a rodar DEPOIS dela — e como é um <script>
         inline sem 'unsafe-inline' liberado, o CSP barra e a janela abre em
         branco, só com um erro de console pra explicar. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' clip:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
