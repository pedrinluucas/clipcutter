appId: com.pedrolucas.clipcutter
productName: ClipCutter
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'

# O sistema operacional NÃO consegue executar um binário de dentro do app.asar.
# Sem estas duas linhas o app empacotado sobe normalmente e falha na primeira
# tentativa de cortar — o clássico "funciona em dev, quebra no .exe". Estava
# previsto na lista de correções do spec original (item 5) desde o começo.
#
# O código compensa o desvio reescrevendo o caminho (src/main/ffmpeg/binaries.ts).
# As duas metades andam juntas: mexer aqui sem mexer lá quebra silenciosamente.
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/@ffprobe-installer/**

win:
  executableName: ClipCutter
nsis:
  # NÃO troque para `oneClick: false` enquanto o build for feito nesta máquina.
  #
  # O instalador com assistente é melhor — pergunta a pasta, pede confirmação, e
  # num app sem assinatura isso conta a favor. Mas gerá-lo exige que o
  # electron-builder EXECUTE um desinstalador temporário durante o build
  # (`computeScriptAndSignUninstaller`), e o Smart App Control do Windows 11 barra
  # esse .exe sem assinatura. O build morre com `spawn UNKNOWN` e deixa em `dist`
  # um artefato de ~450 KB com cara de instalador.
  #
  # Verificado em 17/08/2026: o próprio Windows explicou — "não é possível
  # confirmar quem publicou clipcutter-1.0.0-setup.exe que o aplicativo tentou
  # carregar". O modo de um clique não precisa desse passo, por isso funciona.
  #
  # Caminhos para ter o assistente: build em CI (que não tem Smart App Control),
  # ou assinar o app, ou desligar o Smart App Control — que é decisão de mão única,
  # só reversível reinstalando o Windows.
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # `-` = ASSINATURA AD-HOC, feita pela propria maquina que compila, sem
  # certificado da Apple e sem custo.
  #
  # NAO e cosmetica. Em Apple Silicon o macOS RECUSA executar binario sem
  # assinatura nenhuma -- e recusa em silencio, sem dialogo, sem log, sem saida no
  # terminal. Foi o que aconteceu com o .dmg da v1.0.0: abria e fechava na hora,
  # tanto no M2 do Pedro quanto no runner do CI (que tambem e Apple Silicon).
  # Um Mac Intel teria aberto, e por isso o defeito passou despercebido.
  #
  # Ad-hoc NAO substitui a assinatura da Apple: o app continua "de
  # desenvolvedor nao identificado" e exige botao direito > Abrir na primeira vez.
  # A diferenca e entre "abre com aviso" e "nao abre de jeito nenhum".
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: O ClipCutter precisa ler os vídeos que você escolher.
    - NSDownloadsFolderUsageDescription: O ClipCutter precisa salvar as partes na pasta que você escolher.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: 165915439+pedrinluucas@users.noreply.github.com
  category: AudioVideo
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
